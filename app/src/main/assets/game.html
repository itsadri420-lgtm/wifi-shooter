function solid(x,y){x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=N||y>=N||map[y*N+x]!==0;}
function free(x,y,r){return !solid(x-r,y-r)&&!solid(x+r,y-r)&&!solid(x-r,y+r)&&!solid(x+r,y+r);}
var R={d:0,s:0,u:0,c:1};
function cast(ox,oy,a){
  var dx=Math.cos(a),dy=Math.sin(a),mx=Math.floor(ox),my=Math.floor(oy),ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),sx,sy,sdx,sdy,side=0,i;
  if(dx<0){sx=-1;sdx=(ox-mx)*ddx;}else{sx=1;sdx=(mx+1-ox)*ddx;}
  if(dy<0){sy=-1;sdy=(oy-my)*ddy;}else{sy=1;sdy=(my+1-oy)*ddy;}
  for(i=0;i<64;i++){
    if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}
    if(mx<0||my<0||mx>=N||my>=N||map[my*N+mx])break;
  }
  var d=side?sdy-ddy:sdx-ddx,u=side?ox+d*dx:oy+d*dy;u-=Math.floor(u);
  R.d=d;R.s=side;R.u=u;R.c=(mx<0||my<0||mx>=N||my>=N)?1:map[my*N+mx];
  return d;
}

// ---------- Sound ----------
var ac=null;
function initAudio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  loadSnd();
}
function sfx(f,d,v,type){
  if(!ac)return;
  try{
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d);
  }catch(e){}
}

var SB={};
function loadSnd(){
  if(!ac)return;
  for(var k in P.snd){
    if(SB[k]!==undefined)continue;SB[k]=null;
    (function(k){var b=atob(P.snd[k].split(',')[1]),a=new Uint8Array(b.length);
      for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
      try{ac.decodeAudioData(a.buffer,function(u){SB[k]=u;},function(){});}catch(e){}})(k);
  }
}
function snd(k,v,r){
  if(!ac||!SB[k])return;
  try{var s=ac.createBufferSource(),g=ac.createGain();s.buffer=SB[k];s.playbackRate.value=r||1;g.gain.value=v||.5;s.connect(g);g.connect(ac.destination);s.start();}catch(e){}
}
// ---------- Netzwerk ----------
var ws=null;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
function sendState(){if(OFF)return;send({t:'s',i:me.id,n:me.n,x:r2(me.x),y:r2(me.y),a:r2(me.a),h:me.alive?me.hp:0,k:me.kills,d:me.deaths,w:me.w,f:me.f,r:round});}
function connect(){
  try{ws=new WebSocket('ws://'+location.host+'/');}catch(e){setTimeout(connect,1000);return;}
  ws.onopen=function(){online=true;sendState();};
  ws.onclose=function(){online=false;setTimeout(connect,1000);};
  ws.onerror=function(){};
  ws.onmessage=function(ev){try{onMsg(JSON.parse(ev.data));}catch(e){}};
}
function onMsg(m){
  if(m.t==='s'){
    if(m.i===me.id)return;
    var p=others[m.i];
    if(!p)p=others[m.i]={id:m.i,dx:m.x,dy:m.y,f:m.f};
    if(m.f>p.f)sfx(200,.08,Math.min(.15,.4/(1+Math.hypot(m.x-me.x,m.y-me.y))),'sawtooth');
    p.n=m.n;p.x=m.x;p.y=m.y;p.a=m.a;p.h=m.h;p.k=m.k;p.d=m.d;p.w=m.w;p.f=m.f;p.r=m.r;p.t=performance.now();
  }else if(m.t==='h'){
    if(m.v===me.id)hitMe(m.i,m.d);
  }else if(m.t==='k'){
    if(m.i===me.id)me.kills++;
    pushFeed((m.i===me.id?me.n:(others[m.i]?others[m.i].n:'?'))+'  \u279C  '+(others[m.v]?others[m.v].n:'?'));
  }
}

// ---------- Treffer & Spielablauf ----------
function hitMe(killerId,dmg){
  if(me.alive&&me.inv<=0&&!winner){me.hp-=dmg;me.flash=.5;sfx(150,.12,.2,'square');snd('hurt',.7);if(me.hp<=0)die(killerId);}
}
function damageBot(id,dmg,killerId){
  var p=others[id];
  if(!p||!(p.h>0)||p.inv>0||winner)return;
  p.h-=dmg;
  if(p.h<=0){
    p.h=0;p.d++;p.respawn=3;
    if(killerId==='me'){me.kills++;pushFeed(me.n+'  \u279C  '+p.n);}
    else if(others[killerId]){others[killerId].k++;pushFeed(others[killerId].n+'  \u279C  '+p.n);}
    sfx(90,.4,.12,'sawtooth');
  }
}
function pickSpawn(selfId){
  var best=SPAWNS[0],bd=-1;
  for(var i=0;i<SPAWNS.length;i++){
    var s=SPAWNS[i],md=99;
    if(selfId!=='me'&&me.alive)md=Math.min(md,Math.hypot(me.x-s[0],me.y-s[1]));
    for(var id in others){var p=others[id];if(id===selfId||!(p.h>0))continue;md=Math.min(md,Math.hypot(p.x-s[0],p.y-s[1]));}
    md+=Math.random()*3;
    if(md>bd){bd=md;best=s;}
  }
  return best;
}
function spawn(){
  var b=pickSpawn('me');
  me.x=b[0];me.y=b[1];me.a=Math.atan2(12-me.y,12-me.x);
  me.hp=100;me.alive=true;me.inv=1.5;me.ammo=[12,30,5];me.reload=0;me.cool=0;
}
function die(killer){
  me.alive=false;me.hp=0;me.deaths++;me.respawn=3;
  me.killer=others[killer]?others[killer].n:'?';
  if(others[killer]&&others[killer].bot)others[killer].k++;
  sfx(90,.6,.25,'sawtooth');
  send({t:'k',i:killer,v:me.id});
  pushFeed(me.killer+'  \u279C  '+me.n);
  sendState();
}
function newRound(){
  round++;me.kills=0;me.deaths=0;winner=null;
  for(var id in others){var p=others[id];if(p.bot){p.k=0;p.d=0;botSpawn(p);}}
  spawn();
}
function checkWin(){
  if(winner)return;
  var best=null,bk=-1;
  if(me.kills>=LIM){best=me.n;bk=me.kills;}
  for(var id in others){var p=others[id];if(p.r===round&&p.k>=LIM&&p.k>bk){best=p.n;bk=p.k;}}
  if(best){winner=best;winT=6;}
}
function startReload(){
  if(!me.alive||me.reload>0||me.ammo[me.w]>=WP[me.w].mag)return;
  me.reload=WP[me.w].rel;me.rw=me.w;snd('rel',.5);
}
function switchWeapon(){me.w=(me.w+1)%3;me.reload=0;me.cool=.3;}
function shoot(){
  var wp=WP[me.w];
  if(!me.alive||winner||me.cool>0||me.reload>0)return;
  if(me.ammo[me.w]<=0){startReload();return;}
  me.ammo[me.w]--;me.cool=wp.rate;me.kick=1;me.f++;
  sfx(me.w===0?320:me.w===1?230:110,me.w===2?.45:.1,me.w===2?.3:.13,'sawtooth');
  var a=me.a+(Math.random()-.5)*wp.spread*(moving?2.2:1);
  var wd=cast(me.x,me.y,a),dx=Math.cos(a),dy=Math.sin(a),best=null,bt=wd;
  for(var id in others){
    var p=others[id];if(!(p.h>0))continue;
    var rx=p.x-me.x,ry=p.y-me.y,t=rx*dx+ry*dy;
    if(t<.1||t>bt)continue;
    if(Math.abs(rx*dy-ry*dx)<.3){best=id;bt=t;}
  }
  if(best){
    me.hm=.18;sfx(900,.06,.12,'triangle');snd('hit',.6);
    if(OFF)damageBot(best,wp.dmg,'me');else send({t:'h',i:me.id,v:best,d:wp.dmg});
  }
}
